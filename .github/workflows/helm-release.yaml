name: Helm Chart Release

on:
  push:
    branches:
      - master
    paths:
      - 'helm/**'
    tags:
      - 'karpenter-pulse-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag version to bump (e.g. karpenter-pulse-v1.0.0, or leave blank to package current version)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Git tag version (e.g. karpenter-pulse-v1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  id-token: write # Required for Google Workload Identity Federation
  contents: write # Required to commit and push changes back to the repository

jobs:
  helm-publish:
    name: Lint, Package & Publish Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Version Tag
        id: resolve-tag
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved Tag Name: '$TAG'"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master # Check out master branch to allow committing updates directly to it

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to Google Artifact Registry
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' | helm registry login europe-north1-docker.pkg.dev --username _json_key --password-stdin

      - name: Bump Chart Versions (SemVer)
        if: steps.resolve-tag.outputs.tag_name != ''
        run: |
          echo "Bumping chart versions using tag: ${{ steps.resolve-tag.outputs.tag_name }}"
          python .github/scripts/bump-version.py helm/Chart.yaml ${{ steps.resolve-tag.outputs.tag_name }}
          python .github/scripts/bump-version.py helm/charts/backend/Chart.yaml ${{ steps.resolve-tag.outputs.tag_name }}
          python .github/scripts/bump-version.py helm/charts/frontend/Chart.yaml ${{ steps.resolve-tag.outputs.tag_name }}

      - name: Commit and Push Version Changes
        if: steps.resolve-tag.outputs.tag_name != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/Chart.yaml helm/charts/backend/Chart.yaml helm/charts/frontend/Chart.yaml
          
          # Using [skip ci] in the commit message ensures we do not trigger a recursive workflow run
          git commit -m "chore(release): bump chart version & appVersion to ${{ steps.resolve-tag.outputs.tag_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:master

      - name: Update Chart Dependencies
        run: |
          # Package subcharts locally inside main chart folder
          helm dependency update helm

      - name: Lint Helm Charts
        run: |
          helm lint helm/charts/backend
          helm lint helm/charts/frontend
          helm lint helm

      - name: Package & Push Subcharts
        run: |
          # Package backend subchart
          helm package helm/charts/backend --destination /tmp
          # Push backend subchart to Google Artifact Registry OCI
          helm push /tmp/backend-*.tgz oci://europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY }}
          
          # Package frontend subchart
          helm package helm/charts/frontend --destination /tmp
          # Push frontend subchart to Google Artifact Registry OCI
          helm push /tmp/frontend-*.tgz oci://europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY }}

      - name: Package & Push Umbrella Chart
        run: |
          # Package main umbrella chart
          helm package helm --destination /tmp
          # Push main umbrella chart to Google Artifact Registry OCI
          helm push /tmp/karpenter-pulse-*.tgz oci://europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY }}
