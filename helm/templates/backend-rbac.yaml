{{- if and .Values.backend.enabled .Values.backend.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "karpenter-pulse.serviceAccountName" . }}
  labels:
    {{- include "karpenter-pulse.backendLabels" . | nindent 4 }}
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.backend.enabled .Values.backend.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "karpenter-pulse.backendFullname" . }}-reader
  labels:
    {{- include "karpenter-pulse.backendLabels" . | nindent 4 }}
rules:
  # 1. Karpenter Core Resources (karpenter.sh) - reader with delete on claims for consolidation
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["karpenter.sh"]
    resources: ["nodeclaims"]
    verbs: ["get", "list", "watch", "delete"]
  # 2. Karpenter AWS Provider Resources (karpenter.k8s.aws)
  - apiGroups: ["karpenter.k8s.aws"]
    resources: ["ec2nodeclasses"]
    verbs: ["get", "list", "watch"]
  # 3. Core Standard Kubernetes Resources - reader with delete on nodes for consolidation fallback
  - apiGroups: [""]
    resources: ["pods", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "delete"]
  # 4. Kubernetes Coordination Lease for Karpenter Leader Election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "karpenter-pulse.backendFullname" . }}-reader-binding
  labels:
    {{- include "karpenter-pulse.backendLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "karpenter-pulse.backendFullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "karpenter-pulse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
