# Umbrella values.yaml for karpenter-pulse.
# This file passes configurations directly to subcharts (frontend, backend).

# Global configurations accessible by all subcharts
global:
  environment: production

# Configurations for the Frontend subchart
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: us-docker.pkg.dev/GCP_PROJECT_ID/GCP_REPOSITORY/karpenter-pulse-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: karpenter-pulse.local
        paths:
          - path: /
            pathType: ImplementationSpecific

# Configurations for the Backend subchart
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: us-docker.pkg.dev/GCP_PROJECT_ID/GCP_REPOSITORY/karpenter-pulse-backend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  rbac:
    create: true
  serviceAccount:
    create: true
  config:
    awsRegion: "us-east-1"
    sqsQueueUrl: ""
    clusterName: "my-cluster"
    logLevels: "INFO,SUCCESS,WARNING,ERROR"
    karpenterNamespace: "karpenter"
    karpenterLabelSelector: "app.kubernetes.io/name=karpenter"
